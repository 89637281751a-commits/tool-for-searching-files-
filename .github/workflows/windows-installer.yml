name: Windows installer

on:
  push:
    paths:
      - 'QuickFind.cs'
      - 'QuickFind.csproj'
      - 'QuickFind.ico'
      - 'installer/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    paths:
      - 'QuickFind.cs'
      - 'QuickFind.csproj'
      - 'QuickFind.ico'
      - 'installer/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Install wixl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wixl
      - name: Build current MSI and older test package
        id: build
        run: |
          version=$(dotnet msbuild QuickFind.csproj -nologo -getProperty:Version)
          bash installer/build.sh "$version"
          bash installer/build.sh 0.0.1
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QuickFind-${{ steps.build.outputs.version }}
          path: bin/installer/${{ steps.build.outputs.version }}/QuickFind-${{ steps.build.outputs.version }}.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: older-msi-test-fixture
          path: bin/installer/0.0.1/QuickFind-0.0.1.msi
          if-no-files-found: error

  windows-smoke-test:
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: QuickFind-${{ needs.package.outputs.version }}
          path: msi-current
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: older-msi-test-fixture
          path: msi-older
      - name: Verify legacy migration, upgrade and removal on Windows
        shell: pwsh
        env:
          QUICKFIND_VERSION: ${{ needs.package.outputs.version }}
        run: |
          $test = @{
              CurrentMsi = (Resolve-Path "msi-current/QuickFind-$env:QUICKFIND_VERSION.msi").Path
              CurrentVersion = "$env:QUICKFIND_VERSION.0"
              OlderMsi = (Resolve-Path 'msi-older/QuickFind-0.0.1.msi').Path
          }
          ./installer/Test-Installer.ps1 @test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-installer-logs
          path: installer-logs/*.log
          if-no-files-found: ignore
